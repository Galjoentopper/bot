---
# Centralized Training Configuration
# This single file controls all aspects of the automated trading system pipeline

# Data Acquisition Configuration
data_acquisition:
  symbols: ['BTCEUR', 'ETHEUR', 'ADAEUR', 'DOTEUR', 'LINKEUR']
  interval: '30m'
  lookback_days: 365
  data_sources:
    primary: 'binance'
    fallback: 'yfinance'
  output_directory: './data'
  cache_duration: 3600  # 1 hour

# Training Configuration
training:
  # Model types to train
  models: ['gru', 'lightgbm', 'ppo']

  # Cross-validation settings
  validation_split: 0.2
  test_split: 0.1
  cv_splits: 5
  embargo_period: 24  # hours

  # Training parameters
  max_workers: 8
  batch_size: 512
  epochs: 100
  early_stopping_patience: 10

  # Optimization
  optuna_trials: 100
  optuna_timeout: 7200  # 2 hours

  # Resource allocation
  memory_limit: '16GB'
  gpu_enabled: true
  gpu_memory_fraction: 0.8

# Model-specific parameters
model_parameters:
  lightgbm:
    objective: 'regression'
    metric: 'rmse'
    boosting_type: 'gbdt'
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 5
    n_estimators: 1000
    early_stopping_rounds: 50

  gru:
    hidden_size: 128
    num_layers: 3
    dropout: 0.2
    learning_rate: 0.001
    sequence_length: 60
    epochs: 100

  ppo:
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    total_timesteps: 100000

# Feature Engineering
features:
  technical_indicators: true
  price_features: true
  volume_features: true
  volatility_features: true
  momentum_features: true
  trend_features: true
  statistical_features: true
  fourier_features: true
  wavelet_features: true
  fractal_features: true
  entropy_features: true
  feature_selection: true
  max_features: 200
  selection_method: 'mutual_info'

# Model Export Configuration
export:
  base_directory: './models'
  create_zip_archive: true
  include_metadata: true
  include_preprocessors: true
  include_feature_configs: true
  archive_name_template: 'trading_models_{timestamp}.zip'

# Trading Configuration (for deployment)
trading:
  initial_balance: 10000
  max_position_size: 0.1
  transaction_fee: 0.001
  slippage: 0.0005
  interval: '30m'  # Ensures trader uses 30-minute candles for optimal freshness
  trading_mode: 'candle_aligned'  # 'candle_aligned' or 'fixed_interval'
  trading_interval: 300  # Only used if trading_mode is 'fixed_interval'
  # Wait time after new candle is published (5-30 seconds recommended)
  candle_buffer_seconds: 15

  # Enhanced thresholds for buy/sell signals (reduced sensitivity)
  thresholds:
    default: 0.0005  # Increased from 0.0001 (5x increase)
    per_symbol:
      BTCEUR: 0.0004
      ETHEUR: 0.0004
      ADAEUR: 0.0006
      DOTEUR: 0.0006
      LINKEUR: 0.0005
    use_cost_floor: true
    cost_floor_multiplier: 2.0  # Increased from 1.2
    vol_reference: 0.02
    vol_bounds: [0.3, 3.0]  # Wider bounds

  # Model weights for ensemble
  model_weights:
    gru: 0.45
    lightgbm: 0.45
    ppo: 0.1

  # Risk management
  stop_loss: 0.02
  take_profit: 0.04
  max_drawdown: 0.1

  # Drift monitoring configuration - ENABLED for production server with trained models
  # 
  # This server has trained models present for all symbols, making drift monitoring
  # valuable for detecting data distribution changes that could affect model performance.
  # Configured with appropriate sensitivity and rate limiting to provide useful alerts
  # without overwhelming the system.
  drift_monitoring:
    enabled: true
    sensitivity: 'medium'  # Balanced sensitivity for production use
    alert_frequency_limit: 10  # Max 10 alerts per minute per model-symbol combination
    require_multiple_confirmations: true
    
    # Detection thresholds (tuned for production stability)
    thresholds:
      statistical:
        mean_shift: 3.0        # Z-score threshold for mean changes
        variance_ratio: 2.5    # Variance ratio threshold
        critical: 5.0          # Critical alert threshold
      distribution:
        ks_test: 0.01          # Kolmogorov-Smirnov p-value
        js_divergence: 0.3     # Jensen-Shannon divergence
        critical: 0.5          # Critical alert threshold
      
    # Alert severity levels
    severity_actions:
      low: 'log_only'          # Just log the alert
      medium: 'telegram_alert' # Send Telegram notification
      high: 'immediate_alert'  # Send immediate alert
      critical: 'model_warning' # Flag model for review

# Logging Configuration
logging:
  level: 'INFO'
  training_log: 'logs/training.log'
  trading_log: 'logs/trading.log'
  max_size: '100MB'
  backup_count: 5

# Notifications Configuration
notifications:
  telegram:
    enabled: true
    bot_token: '7733436451:AAH6Sls8uL4fEgd6Ty7VEKSBIMauhaVkN4c'
    chat_id: '7988790407'

# Profit Optimization Configuration
profit_optimization:
  min_profit_pct: 0.02  # 2% minimum profit target
  max_position_pct: 0.25  # 25% maximum position size
  trailing_stop_pct: 0.05  # 5% trailing stop loss
  profit_target_pct: 0.15  # 15% profit target
  max_holding_days: 7  # Maximum holding period
  volatility_adjustment: true
  correlation_threshold: 0.7

# Performance Analytics Configuration
performance_analytics:
  risk_free_rate: 0.02  # 2% annual risk-free rate
  benchmark_return: 0.08  # 8% annual benchmark return
  min_sharpe_ratio: 1.0
  max_drawdown_threshold: 0.15  # 15%
  min_win_rate: 0.45  # 45%
  report_frequency: 'hourly'
  export_path: 'reports'

# Cross-platform Configuration
cross_platform:
  linux_training_dir: '/tmp/trading_models'
  windows_deployment_dir: 'C:\\trading_models'
  transfer_package_name: 'models_transfer.zip'

# Error Handling
error_handling:
  max_retries: 3
  retry_delay: 5
  auto_recovery: true
  recovery_timeout: 300
