---
# Centralized Training Configuration
# This single file controls all aspects of the automated trading system pipeline

# Data Acquisition Configuration
data_acquisition:
  symbols: ['BTCEUR', 'ETHEUR', 'ADAEUR', 'DOTEUR', 'LINKEUR']
  interval: '30m'
  lookback_days: 365
  use_local_databases: true
  data_sources:
    primary: 'binance'
    fallback: 'yfinance'
  output_directory: './data'
  cache_duration: 3600  # 1 hour

# Training Configuration
training:
  # Model types to train
  models: ['ppo', 'gru', 'lightgbm']  # Full ensemble with PPO first
  random_seed: 42

  # Cross-validation settings
  validation_split: 0.2
  test_split: 0.1
  cv_splits: 5
  embargo_period: 24  # hours

  # Training parameters
  max_workers: 8
  batch_size: 512
  epochs: 100
  early_stopping_patience: 10

  # Optimization
  optuna_trials: 100
  optuna_timeout: 7200  # 2 hours

  # Resource allocation
  memory_limit: '5GB'  # Adjusted to use available RAM+swap (3.7GB + 2GB)
  gpu_enabled: true    # RTX A4000 GPU detected on this training server
  gpu_memory_fraction: 0.8

# Model management & deployment overrides
model_management:
  models_dir: './models'

# Model-specific configurations (moved to model_parameters section below)
# Advanced Performance Optimization Configuration
performance_optimization:
  # Memory Management
  lazy_loading: true              # Load models on-demand
  memory_mapping: true            # Use memory-mapped files
  garbage_collection_interval: 300 # Force GC every 5 minutes
  max_memory_usage_mb: 3584       # 3.5GB memory limit (system has 3.7GB RAM)

  # Prediction Optimization
  enable_prediction_caching: true # Cache predictions for performance
  cache_size: 2000               # Max cached predictions
  cache_ttl_seconds: 600         # 10-minute cache lifetime
  batch_inference: true          # Batch predictions together

  # Processing Optimization
  parallel_loading: true         # Multi-threaded model loading
  optimal_thread_count: 4        # Optimal number of threads
  enable_async_processing: true  # Async data processing

  # System Optimization
  auto_optimize_interval_minutes: 15 # Auto-optimization interval
  startup_timeout: 300           # System startup timeout
  model_warmup: false            # Skip warmup in production

  # Advanced Features
  feature_caching: true          # Cache engineered features
  connection_pooling: true       # Database connection pooling
  compression_level: 6           # Data compression level (1-9)

# Comprehensive System Monitoring Configuration
monitoring:
  enabled: true
  check_interval_seconds: 60     # Health check frequency

  # Alert Thresholds
  alert_thresholds:
    cpu_usage: 85.0              # CPU usage alert threshold
    memory_usage: 85.0           # Memory usage alert threshold
    disk_usage: 90.0             # Disk usage alert threshold
    prediction_success_rate: 80.0 # Model prediction success rate
    data_freshness_hours: 2.0    # Maximum data age
    max_errors_per_hour: 10      # Error rate threshold
    performance_score: 60.0      # Composite performance score

  # Alerting Configuration
  telegram_alerts: true          # Send alerts via Telegram
  alert_cooldown_minutes: 5      # Minimum time between duplicate alerts
  escalation_after_failures: 3  # Escalate after N consecutive failures

  # Dashboard and Reporting
  health_dashboard: true         # Enable health dashboard
  performance_reports: true      # Generate performance reports
  report_interval_hours: 24      # Report generation frequency

  # Advanced Monitoring
  model_drift_detection: true    # Monitor model performance drift
  anomaly_detection: true        # Detect system anomalies
  predictive_alerts: true        # Predict potential issues

# Model-specific parameters
model_parameters:
  lightgbm:
    objective: 'regression'
    metric: 'rmse'
    boosting_type: 'gbdt'
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 5
    n_estimators: 1000
    early_stopping_rounds: 50

  gru:
    hidden_size: 128
    num_layers: 3
    dropout: 0.2
    learning_rate: 0.001
    sequence_length: 60
    epochs: 100

  ppo:
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    total_timesteps: 100000
    # Superior PPO configuration
    feature_mode: superior
    expected_feature_count: 103
    superior_sequence_length: 32

# Feature Engineering
features:
  technical_indicators: true
  price_features: true
  volume_features: true
  volatility_features: true
  momentum_features: true
  trend_features: true
  statistical_features: true
  fourier_features: true
  wavelet_features: true
  fractal_features: true
  entropy_features: true
  feature_selection: true
  max_features: 200
  selection_method: 'mutual_info'

  # Feature periods and configurations
  volatility_periods: [5, 10, 20, 50, 100]
  momentum_periods: [5, 10, 20, 50, 100, 200]
  volume_periods: [5, 10, 20, 50]
  price_periods: [5, 10, 20, 50, 100]
  rsi_periods: [7, 14, 21]
  bollinger_periods: [20, 50]
  bollinger_std: 2.0
  atr_periods: [14, 21]

  # MACD configurations
  macd_configs:
    - fast: 12
      slow: 26
      signal: 9
    - fast: 5
      slow: 15
      signal: 7

  # Risk metrics
  sharpe_windows: [20, 50, 100]
  max_drawdown_windows: [20, 50, 100]
  var_confidence: 0.05
  var_windows: [20, 50]

  # Market microstructure
  support_resistance_window: 50
  volume_profile_bins: 20
  order_flow_window: 10

  # Market regime detection
  regime_detection_window: 100
  trend_strength_window: 50
  volatility_regime_window: 50

  # Data quality
  min_periods_ratio: 0.7
  remove_outliers: true
  outlier_std_threshold: 5.0

# Target Engineering Configuration
targets:
  # Transaction costs (in basis points)
  transaction_cost_bps: 25  # 0.25% per trade (updated for PPO)
  slippage_bps: 5  # 0.05% slippage
  funding_cost_bps: 1  # 0.01% funding cost per period

  # Target horizons (in periods - for 30min candles)
  horizons: [1, 3, 6, 12, 24]  # 30min to 12h prediction horizons

  # Risk adjustment
  risk_free_rate: 0.0  # Assume 0% risk-free rate for crypto
  vol_adjustment: true  # Risk-adjust returns by volatility
  vol_window: 20  # Window for volatility calculation

  # Classification thresholds (returns)
  buy_threshold: 0.005  # 0.5% minimum for buy signal
  sell_threshold: -0.005  # -0.5% minimum for sell signal
  strong_signal_multiplier: 2.0  # 2x threshold for strong signals

  # Market regime adjustment
  regime_adjustment: true
  bull_multiplier: 1.2  # Higher threshold in bull markets
  bear_multiplier: 0.8  # Lower threshold in bear markets

  # Multi-target configuration
  include_magnitude: true  # Include return magnitude targets
  include_direction: true  # Include direction classification
  include_confidence: true  # Include confidence targets
  include_risk_adjusted: true  # Include risk-adjusted targets

# Model Export Configuration
export:
  base_directory: './models'
  create_zip_archive: true
  include_metadata: true
  include_preprocessors: true
  include_feature_configs: true
  archive_name_template: 'trading_models_{timestamp}.zip'

# Trading Configuration (for deployment)
trading:
  initial_balance: 10000
  max_position_size: 0.1
  transaction_fee: 0.001
  slippage: 0.0005
  interval: '30m'  # Ensures trader uses 30-minute candles for optimal freshness
  trading_mode: 'candle_aligned'  # 'candle_aligned' or 'fixed_interval'
  trading_interval: 300  # Only used if trading_mode is 'fixed_interval'
  # Wait time after new candle is published (5-30 seconds recommended)
  candle_buffer_seconds: 15

  # Optimized thresholds for buy/sell signals (improved for profitability)
  thresholds:
    default: 0.00005  # Ultra low from 0.0001
    per_symbol:
      BTCEUR: 0.00003  # Ultra aggressive for major pairs
      ETHEUR: 0.00003
      ADAEUR: 0.00005  # Ultra low for altcoins
      DOTEUR: 0.00005
      LINKEUR: 0.00005
    use_cost_floor: true
    cost_floor_multiplier: 1.0  # Reduced from 2.0
    vol_reference: 0.02
    vol_bounds: [0.5, 2.5]  # Tighter bounds for better control

  # Model weights for ensemble - optimized for better performance
  model_weights:
    gru: 0.35
    lightgbm: 0.55  # Increased weight for better performing model
    ppo: 0.1

  # Signal generation thresholds - CALIBRATED settings for profitable trading
  confidence_threshold: 0.75  # Increased from 0.25 to filter weak signals
  base_buy_threshold: 0.005  # Increased from 0.00005 to 0.5% minimum return
  base_sell_threshold: -0.005  # Increased from -0.00005 to -0.5% minimum loss
  volatility_threshold_multiplier: 1.5  # Increased from 1.0 for better risk adjustment

  # Adaptive model weighting
  adaptive_weights: true       # Enable performance-based weight adjustment
  weight_adaptation_rate: 0.1  # Rate of weight adaptation (0.1 = 10% per update)

  # Legacy thresholds for backward compatibility
  buy_threshold: 0.005
  sell_threshold: -0.005

  # Advanced Risk Management Configuration
risk_management:
  max_portfolio_risk: 0.02          # 2% maximum portfolio risk per day
  max_position_pct: 0.15            # 15% maximum position size
  max_correlation_exposure: 0.4      # 40% maximum in correlated assets
  kelly_multiplier: 0.25            # Conservative Kelly Criterion multiplier
  volatility_lookback: 20           # Periods for volatility calculation

  # Dynamic stop-loss and take-profit
  stop_loss: 0.02                   # 2% base stop loss
  take_profit: 0.04                 # 4% base take profit
  trailing_stop_pct: 0.015          # 1.5% trailing stop

  # Portfolio constraints
  max_drawdown: 0.05                # 5% maximum drawdown
  position_sizing_method: 'kelly_criterion'
  volatility_scaling: true

# Portfolio Optimization Configuration
portfolio_optimization:
  rebalance_threshold: 0.05         # 5% deviation triggers rebalancing
  lookback_period: 60               # 60 periods for optimization
  risk_free_rate: 0.02              # 2% annual risk-free rate
  optimization_method: 'max_sharpe' # max_sharpe, min_volatility, risk_parity

  # Portfolio constraints
  max_weight_per_asset: 0.25        # 25% maximum per asset
  min_weight_per_asset: 0.01        # 1% minimum per asset
  max_correlation_cluster: 0.4      # 40% max in correlated cluster

  # Drift monitoring configuration - DISABLED as requested
  #
  # This server has trained models present for all symbols, making drift monitoring
  # valuable for detecting data distribution changes that could affect model performance.
  # Configured with appropriate sensitivity and rate limiting to provide useful alerts
  # without overwhelming the system.
  drift_monitoring:
    enabled: false
    sensitivity: 'medium'  # Balanced sensitivity for production use
    alert_frequency_limit: 10  # Max 10 alerts per minute per model-symbol combination
    require_multiple_confirmations: true

    # Detection thresholds (tuned for production stability)
    thresholds:
      statistical:
        mean_shift: 3.0        # Z-score threshold for mean changes
        variance_ratio: 2.5    # Variance ratio threshold
        critical: 5.0          # Critical alert threshold
      distribution:
        ks_test: 0.01          # Kolmogorov-Smirnov p-value
        js_divergence: 0.3     # Jensen-Shannon divergence
        critical: 0.5          # Critical alert threshold

    # Alert severity levels
    severity_actions:
      low: 'log_only'          # Just log the alert
      medium: 'telegram_alert' # Send Telegram notification
      high: 'immediate_alert'  # Send immediate alert
      critical: 'model_warning' # Flag model for review

# Logging Configuration
logging:
  level: 'INFO'
  training_log: 'logs/training.log'
  trading_log: 'logs/trading.log'
  max_size: '100MB'
  backup_count: 5

# Notifications Configuration
notifications:
  telegram:
    enabled: true
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}
    # Granular notification controls
    notification_types:
      trades: false              # Individual buy/sell notifications
      portfolio_updates: false   # Portfolio summary after trades
      startup_shutdown: true     # System startup/shutdown messages
      performance_reports: false # Hourly performance reports (disabled)
      daily_reports: true        # Daily performance reports at 12:00 UTC
      errors: true              # System error notifications

# Enhanced Profit Optimization Configuration - Improved for Sharpe ratio
profit_optimization:
  min_profit_pct: 0.015  # 1.5% minimum profit target
  max_position_pct: 0.15  # 15% maximum position size (better diversification)
  trailing_stop_pct: 0.025 # 2.5% trailing stop loss (tighter risk control)
  profit_target_pct: 0.06 # 6% profit target (more conservative)
  max_holding_days: 3     # 3 days maximum holding period (reduce time risk)
  volatility_adjustment: true
  correlation_threshold: 0.5  # Lower correlation threshold for better diversification
  # Enhanced parameters for better risk-adjusted returns
  partial_profit_taking: true
  profit_scaling_levels: [0.015, 0.03, 0.045]  # Take profits at 1.5%, 3%, 4.5%
  profit_scaling_amounts: [0.25, 0.35, 0.4]    # Sell 25%, 35%, 40% at each level
  # Risk management enhancements
  max_daily_trades: 10    # Limit daily trades to prevent overtrading
  min_time_between_trades: 0    # No delay between trades; allow simultaneous buys per candle
  volatility_filter: true # Filter trades during high volatility
  volatility_threshold: 0.03  # 3% volatility threshold

# Performance Analytics Configuration - Enhanced for risk monitoring
performance_analytics:
  risk_free_rate: 0.02  # 2% annual risk-free rate
  benchmark_return: 0.08  # 8% annual benchmark return
  min_sharpe_ratio: 1.5   # Target higher Sharpe ratio
  max_drawdown_threshold: 0.05  # 5% maximum drawdown threshold
  min_win_rate: 0.50  # 50% minimum win rate target
  report_frequency: 'hourly'
  export_path: 'reports'
  # Additional risk metrics
  max_var_95: 0.03      # 3% maximum Value at Risk (95% confidence)
  min_calmar_ratio: 2.0  # Minimum Calmar ratio (return/max drawdown)
  risk_monitoring_interval: 300  # Monitor risk every 5 minutes

# Cross-platform Configuration
cross_platform:
  linux_training_dir: '/tmp/trading_models'
  windows_deployment_dir: 'C:\\trading_models'
  transfer_package_name: 'models_transfer.zip'

# Error Handling
error_handling:
  max_retries: 3
  retry_delay: 5
  auto_recovery: true
  recovery_timeout: 300
