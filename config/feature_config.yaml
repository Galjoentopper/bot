# Feature Configuration for Enhanced Trading Bot
# =============================================
# Professional configuration for model-specific feature requirements

models:
  ppo:
    expected_feature_count: 104
    feature_groups:
      - "core_technical"      # 15 features: RSI, MACD, Bollinger Bands, etc.
      - "price_momentum"      # 20 features: Multi-timeframe momentum
      - "volatility_risk"     # 15 features: Volatility and risk metrics
      - "volume_analysis"     # 12 features: Volume-based indicators
      - "market_microstructure" # 10 features: Spread, support/resistance
      - "regime_detection"    # 8 features: Market regime indicators
      - "time_features"       # 6 features: Time-based cyclical features
      - "advanced_technical"  # 12 features: Advanced indicators (ADX, Ichimoku, etc.)
      - "statistical_features" # 6 features: Skewness, kurtosis, autocorr
    description: "PPO models require comprehensive feature set for reinforcement learning"

  gru:
    expected_feature_count: 100
    feature_groups:
      - "core_technical"      # 15 features
      - "price_momentum"      # 20 features
      - "volatility_risk"     # 15 features
      - "volume_analysis"     # 12 features
      - "market_microstructure" # 10 features
      - "regime_detection"    # 8 features
      - "time_features"       # 6 features
      - "advanced_technical"  # 12 features
      - "statistical_features" # 2 features (reduced for GRU)
    description: "GRU models work well with temporal patterns and technical indicators"

  lightgbm:
    expected_feature_count: 100
    feature_groups:
      - "core_technical"      # 15 features
      - "price_momentum"      # 20 features
      - "volatility_risk"     # 15 features
      - "volume_analysis"     # 12 features
      - "market_microstructure" # 10 features
      - "regime_detection"    # 8 features
      - "time_features"       # 6 features
      - "advanced_technical"  # 12 features
      - "statistical_features" # 2 features (reduced for LightGBM)
    description: "LightGBM excels with diverse feature types and non-linear relationships"

