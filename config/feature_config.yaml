feature_engineering:
  # Enhanced feature generation settings
  enable_advanced_features: true
  enable_statistical_features: true
  enable_regime_detection: true

  # Feature validation settings
  remove_outliers: true
  outlier_std_threshold: 5.0
  min_periods_ratio: 0.7

  # Feature scaling and preprocessing
  scaling_method: "robust"  # robust, standard, minmax
  handle_missing: "forward_fill"  # forward_fill, median, zero

  # Performance settings
  batch_processing: true
  parallel_computation: false  # Set to true for large datasets
  cache_features: true

validation:
  # Feature validation rules
  max_correlation: 0.95  # Remove highly correlated features
  min_variance: 1e-6     # Remove zero-variance features
  max_missing_ratio: 0.3 # Remove features with too many missing values

  # Quality checks
  check_infinite_values: true
  check_extreme_outliers: true
  validate_feature_names: true

logging:
  level: "INFO"
  log_feature_counts: true
  log_processing_time: true
  log_validation_results: true
